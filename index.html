<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jogo de Engenharia Urbana</title>
  </head>
  <body>
    <h1>Jogo de Engenharia Urbana</h1>
    <p id="status">Carregando dados…</p>

    <!--
      ETAPA 1: esta página só confere se os dados e a configuração carregam
      no navegador. Na etapa 3 ela vira o jogo de verdade.
      type="module" permite usar "import". Por isso a página precisa ser
      aberta por um servidor (Live Server ou python -m http.server),
      e não com duplo clique no arquivo.
    -->
    <script type="module">
      import { PROBLEMAS, DISCIPLINAS } from './js/dados/problemas.js';
      import { CONFIG } from './js/config.js';

      const nomes = DISCIPLINAS.map((d) => d.nome).join(', ');
      document.getElementById('status').textContent =
        `OK: ${PROBLEMAS.length} problemas carregados (${nomes}). ` +
        `Partida de ${CONFIG.totalDias} dias com ${CONFIG.cartasPorTurno} cartas por turno.`;
    </script>
  </body>
</html>
